<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradys loader options</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@1,700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--gold:#e3a01c;--gold2:#f4c35a;--cream:#f3eee3;--black:#0d0c0b}
*{box-sizing:border-box}body{margin:0;background:#222;font-family:Oswald,sans-serif;color:var(--cream)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.box{position:relative;height:380px;overflow:hidden;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.tag{position:absolute;top:10px;left:10px;z-index:5;background:var(--gold);color:var(--black);font:700 11px/1 Oswald;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.hint{position:absolute;bottom:10px;right:12px;font:500 11px Oswald;letter-spacing:.12em;opacity:.5;text-transform:uppercase}
.replay .anim,.replay .anim *{animation:none!important}

/* A — Neon (current) */
.a{background:radial-gradient(ellipse,#1c1408,#050505 75%)}
.a .sign{position:relative;width:300px;aspect-ratio:400/240;display:grid;place-items:center}
.a svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.a rect{fill:none;stroke:#ffd27a;stroke-width:3.5;stroke-dasharray:1000;stroke-dashoffset:1000;filter:drop-shadow(0 0 3px #ffe7b0) drop-shadow(0 0 10px #e3a01c) drop-shadow(0 0 22px #ff8a00);animation:draw 1s .15s forwards}
.a img{width:82%;opacity:0;filter:brightness(1.15) drop-shadow(0 0 8px #e3a01c) drop-shadow(0 0 20px #ff8a00);animation:on 1.2s .35s steps(1,end) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes on{0%{opacity:0}8%{opacity:.9}12%{opacity:.15}20%{opacity:1}24%{opacity:.3}34%{opacity:1}38%{opacity:.55}44%,100%{opacity:1}}

/* B — Marquee bulbs (vintage theater / bar sign) */
.b{background:radial-gradient(ellipse,#2a1a06,#0b0806 70%)}
.marq{position:relative;width:330px;height:200px;border-radius:22px;background:linear-gradient(#1a1209,#0e0a06);border:4px solid #3a2a12;box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 20px 40px rgba(0,0,0,.6);display:grid;place-items:center}
.marq img{width:76%;opacity:0;transform:scale(.92);animation:pop .7s .9s cubic-bezier(.2,.8,.2,1.2) forwards}
.bulb{position:absolute;width:12px;height:12px;border-radius:50%;background:#5a4214;box-shadow:inset 0 -2px 3px rgba(0,0,0,.5);animation:bulb .9s infinite}
@keyframes bulb{0%,100%{background:#5a4214;box-shadow:inset 0 -2px 3px rgba(0,0,0,.5)}40%,60%{background:#fff4c9;box-shadow:0 0 6px #fff1b8,0 0 14px #f4c35a,0 0 26px #e3a01c}}
@keyframes pop{to{opacity:1;transform:none}}

/* C — LED scoreboard dot-matrix */
.c{background:#050505}
.led{position:relative;width:340px;padding:22px 20px;border-radius:12px;background:#0a0a0a;border:6px solid #262626;box-shadow:inset 0 0 0 2px #3a3a3a,0 20px 40px rgba(0,0,0,.7);text-align:center;
  background-image:radial-gradient(circle,#161616 1.2px,transparent 1.4px);background-size:6px 6px}
.led .t{font:64px/1 VT323;letter-spacing:.14em;color:#ffb627;text-shadow:0 0 6px rgba(255,182,39,.9),0 0 16px rgba(255,140,0,.6)}
.led .t span{opacity:0;animation:ledOn .05s forwards}
.led .s{font:26px/1 VT323;letter-spacing:.2em;color:#5dff7a;text-shadow:0 0 8px rgba(93,255,122,.8);margin-top:8px;opacity:0;animation:blink 1s 1.1s steps(2,end) 2 forwards}
.led img{position:absolute;inset:0;margin:auto;width:78%;opacity:0;animation:swap .5s 2s forwards}
.led .t,.led .s{animation-fill-mode:forwards}
.c .fadeout{animation:fo .4s 1.9s forwards}
@keyframes ledOn{to{opacity:1}}@keyframes blink{0%{opacity:0}50%,100%{opacity:1}}
@keyframes swap{to{opacity:1}}@keyframes fo{to{opacity:0}}

/* D — Clean logo reveal (no lights): gold wipe + shine */
.d{background:var(--black)}
.d .wrap{position:relative;width:320px}
.d img{width:100%;clip-path:inset(0 100% 0 0);animation:wipe 1s .2s cubic-bezier(.7,0,.2,1) forwards}
.d .shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;mix-blend-mode:overlay;animation:shine 1s 1.2s forwards;-webkit-mask:url(assets/logo.png) center/contain no-repeat;mask:url(assets/logo.png) center/contain no-repeat}
.d .bar{position:absolute;left:0;right:0;bottom:-28px;height:3px;background:#2a2622;overflow:hidden;border-radius:3px}
.d .bar i{display:block;height:100%;width:0;background:var(--gold);animation:fill 1.6s .1s ease-out forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}@keyframes shine{to{background-position:-50% 0}}@keyframes fill{to{width:100%}}
</style></head><body>
<div class="grid">
  <div class="box a" data-box><span class="tag">A · Neon sign (current)</span><div class="anim sign"><svg viewBox="0 0 400 240" preserveAspectRatio="none"><rect x="6" y="6" width="388" height="228" rx="34" pathLength="1000"/></svg><img src="assets/logo.png" alt=""></div><span class="hint">click to replay</span></div>

  <div class="box b" data-box><span class="tag">B · Marquee light bulbs</span><div class="anim marq" data-bulbs><img src="assets/logo.png" alt=""></div><span class="hint">click to replay</span></div>

  <div class="box c" data-box><span class="tag">C · LED scoreboard</span><div class="anim led"><div class="fadeout"><div class="t" data-led>GRADYS</div><div class="s">● GAME ON</div></div><img src="assets/logo.png" alt=""></div><span class="hint">click to replay</span></div>

  <div class="box d" data-box><span class="tag">D · Clean gold reveal (no lights)</span><div class="anim wrap"><img src="assets/logo.png" alt=""><span class="shine"></span><span class="bar"><i></i></span></div><span class="hint">click to replay</span></div>
</div>
<script>
// Marquee bulbs around the frame, chasing
document.querySelectorAll('[data-bulbs]').forEach(m=>{
  const W=330,H=200,step=22,pts=[];
  for(let x=14;x<=W-14;x+=step)pts.push([x,8]);
  for(let y=8+step;y<=H-8;y+=step)pts.push([W-8,y]);
  for(let x=W-14-step;x>=14;x-=step)pts.push([x,H-8]);
  for(let y=H-8-step;y>8;y-=step)pts.push([8,y]);
  pts.forEach(([x,y],i)=>{const b=document.createElement('i');b.className='bulb';b.style.left=(x-6-4)+'px';b.style.top=(y-6-4)+'px';b.style.animationDelay=(-(i%3)*0.3)+'s';m.appendChild(b);});
});
// LED letters light up one by one
document.querySelectorAll('[data-led]').forEach(t=>{t.innerHTML=[...t.textContent].map((c,i)=>`<span style="animation-delay:${.15+i*.12}s">${c}</span>`).join('')});
// Click to replay
document.querySelectorAll('[data-box]').forEach(b=>b.addEventListener('click',()=>{b.classList.add('replay');void b.offsetWidth;b.classList.remove('replay')}));
</script>
</body></html>
